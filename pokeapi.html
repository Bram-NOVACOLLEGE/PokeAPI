<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PokéAPI</title>
    <link rel="stylesheet" href="pokeapi.css">
</head>
<body>

<div id="pokedex-kolom">

    <div class="rood" id="bovenste-balk">
        <div id="lens">
            <div id="dot"></div>
            <div id="dot2"></div>
            <div id="dot3"></div>
        </div>
        <div id="zoek-balk">
            <input type="text" id="zoek-input" placeholder="Type here to search"    >
        </div>
    </div>

    <div class="rood" id="middelste-blok">
        <div id="middel-boven">
            <div id="vak1-middel"></div>
            <div id="middel-rechts">
                <div id="vak2-middel"></div>
                <div id="vak3-middel"></div>
            </div>
        </div>
        <div id="vak4-middel"></div>
    </div>

    <div class="rood" id="onderste-balk">
        <div id="vak1-onder"></div>
        <div id="vak2-onder"></div>
    </div>

</div>

<script src="pokeapi.js"></script>
</body>
</html>
