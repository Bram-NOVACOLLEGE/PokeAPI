<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PokéAPI</title>
    <link rel="stylesheet" href="pokeapi.css">
</head>
<body>

<div class="pokedex-kolom">

    <div class="rood bovenste-balk">
        <div class="lens">
            <div class="dot"></div>
            <div class="dot2"></div>
            <div class="dot3"></div>
        </div>
        <input class="zoek-balk" placeholder="Type here to search"/>
    </div>


    <div class="rood middelste-blok">

        <div class="middel-boven">
            <div class="vak1-middel"></div>
            <div class="middel-rechts">
                <div class="vak2-middel"></div>
                <div class="vak3-middel"></div>
            </div>
        </div>

        <div class="vak4-middel"></div>
    </div>


    <div class="rood onderste-balk">
        <div class="vak1-onder"></div>
        <div class="vak2-onder"></div>
    </div>

</div>

<script src="pokeapi.js"></script>
</body>
</html>
